<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>PaySlip — Tableau de bord Employeur</title>
  <link rel='stylesheet' href='/static/css/style.css'>
</head>
<body>
<div class='sidebar-overlay' id='overlay' onclick='closeSidebar()'></div>
<div class='layout'>
  <aside class='sidebar' id='sidebar'>
    <div class='logo'>PaySlip <span>Manager</span></div>
    <nav>
      <a href='#' class='active' onclick='showSection("dashboard")'>Tableau de bord</a>
      <a href='#' onclick='showSection("employes")'>Employes</a>
      <a href='#' onclick='showSection("fiches")'>Fiches de paie</a>
      <a href='#' onclick='showSection("historique")'>Historique</a>
    </nav>
    <div class='logout'><a onclick='logout()'>Deconnexion</a></div>
  </aside>
  <main class='main'>
    <div class='topbar'>
      <div style='display:flex;align-items:center;gap:12px;'>
        <button class='burger' onclick='toggleSidebar()'>☰</button>
        <strong id='page-title'>Tableau de bord</strong>
      </div>
      <div class='user-info'>
        <div class='avatar' id='avatar'>--</div>
        <div>
          <div style='font-weight:700;font-size:14px' id='user-name'>---</div>
          <div style='font-size:12px;color:#8FA3B1'>Employeur</div>
        </div>
      </div>
    </div>
    <!-- Les 4 sections vont ici -->
    <section id='s-dashboard'>...</section>
    <section id='s-employes' style='display:none'>...</section>
    <section id='s-fiches' style='display:none'>...</section>
    <section id='s-historique' style='display:none'>...</section>
  </main>
</div>
<div id='toast'></div>
<script src='/static/js/api.js'></script>
<script>
  // Verification que l'utilisateur est connecte
  if (!getToken() || getUser().role !== 'employeur') window.location.href = '/';
  const user = getUser();
  document.getElementById('user-name').textContent = user.prenom + ' ' + user.nom;
  document.getElementById('avatar').textContent = initiales(user.nom, user.prenom);

function showSection(name) {
  ['dashboard','employes','fiches','historique'].forEach(s => {
    document.getElementById('s-' + s).style.display = 'none';
  });
  document.getElementById('s-' + name).style.display = 'block';
  const titles = {
    dashboard: 'Tableau de bord',
    employes: 'Employes',
    fiches: 'Fiches de paie',
    historique: 'Historique'
  };
  document.getElementById('page-title').textContent = titles[name];
  if (name === 'dashboard')  loadStats();
  if (name === 'employes')   loadEmployes();
  if (name === 'fiches')     loadFiches();
  if (name === 'historique') loadHistorique();
  if (window.innerWidth <= 768) closeSidebar();
}

async function loadStats() {
  try {
    const s = await apiFetch('/employeur/stats');
    document.getElementById('st-employes').textContent  = s.total_employes;
    document.getElementById('st-fiches').textContent    = s.total_fiches;
    document.getElementById('st-envoyees').textContent  = s.fiches_envoyees;
    document.getElementById('st-attente').textContent   = s.fiches_en_attente;
  } catch(e) { toast(e.message, 'error'); }
}

async function loadEmployes() {
  const employes = await apiFetch('/employeur/employes');
  const tb = document.getElementById('tbody-employes');
  tb.innerHTML = employes.map(e => `
    <tr>
      <td><strong>${e.prenom} ${e.nom}</strong></td>
      <td>${e.email}</td>
      <td>${e.poste || '---'}</td>
      <td>
        <span class='badge ${e.actif ? 'badge-success' : 'badge-danger'}'>
          ${e.actif ? 'Actif' : 'Desactive'}
        </span>
      </td>
    </tr>`).join('');
}
</script>
</body>
</html>
